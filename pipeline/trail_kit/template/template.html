<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one sticky full-screen 3D stage; a tall scroll track drives the hiker; story cards scroll over the stage. */
:root {
  --ink: #101418;
  --panel: rgba(16, 20, 24, 0.82);
  --line: #2A333B;
  --text: #F2EFE9;
  --muted: #B4BCC3;
  --sand: #F08A4B;
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { background: var(--ink); color: var(--text); font-family: var(--body); }
body { margin: 0; }
.maplibregl-map { position: relative; overflow: hidden; -webkit-tap-highlight-color: transparent; }
.maplibregl-canvas-container, .maplibregl-canvas { position: absolute; left: 0; top: 0; }
.maplibregl-canvas { outline: none; }
#stage { position: sticky; top: 0; height: 100vh; height: 100dvh; width: 100%; overflow: hidden; }
#map { position: absolute; inset: 0; background: linear-gradient(#7fa7c9, #e9cfae 70%, #c98a5a); }
#hud {
  position: absolute; z-index: 3; display: flex; flex-wrap: wrap; gap: 10px; align-items: stretch;
  top: calc(env(safe-area-inset-top, 0px) + 16px);
  right: max(16px, env(safe-area-inset-right, 0px));
}
.chip { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; min-width: 120px; backdrop-filter: blur(6px); }
.chip .k { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.chip .v { font-family: var(--display); font-weight: 800; font-size: 22px; font-variant-numeric: tabular-nums; }
.chip .s { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
#backBtn { position: absolute; z-index: 5; top: calc(env(safe-area-inset-top, 0px) + 16px); left: max(16px, env(safe-area-inset-left, 0px)); display: inline-flex; align-items: center; box-sizing: border-box; min-height: 44px; max-width: min(70vw, 360px); padding: 0 16px; font: 600 14px var(--body); color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; text-decoration: none; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#backBtn:hover { border-color: var(--muted); }
#backBtn:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
#brand { position: absolute; z-index: 3; top: calc(env(safe-area-inset-top, 0px) + 16px); left: 50%; transform: translateX(-50%); white-space: nowrap; font-family: var(--display); font-weight: 800; font-size: 18px; background: var(--panel); padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); }
#profile {
  position: absolute; z-index: 3; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px 8px; backdrop-filter: blur(6px);
}
#profile svg { display: block; width: 100%; height: 70px; }
#profile .lab { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
#credits { position: absolute; z-index: 3; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 126px); font-size: 10.5px; color: var(--text); background: rgba(16,20,24,0.6); padding: 4px 8px; border-radius: 6px; max-width: 70%; text-align: right; }
#credits a { color: var(--text); }
#status { position: absolute; z-index: 4; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 15px; color: var(--muted); pointer-events: none; }
#status[hidden], #hint[hidden] { display: none; }
#track { position: relative; margin-top: -100vh; margin-top: -100dvh; height: __SCROLL_VH__vh; pointer-events: none; }
.step {
  position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); width: min(380px, calc(100% - 32px));
  background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; box-sizing: border-box;
  backdrop-filter: blur(6px); pointer-events: auto;
}
.step { padding: 0; overflow: hidden; width: min(400px, calc(100% - 32px)); }
.step img { display: block; width: 100%; height: auto; aspect-ratio: 4 / 3; object-fit: cover; max-width: 100%; background: #2a2018; }
.step .body { padding: 14px 18px 14px; }
.step .credit { margin-top: 10px; font-size: 11px; line-height: 1.4; color: var(--muted); }
.step .credit a { color: var(--muted); }
.step .eyebrow { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--sand); font-weight: 600; }
.step h2 { font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1.1; margin: 6px 0 8px; text-wrap: balance; }
.step p { margin: 0; font-size: 15px; line-height: 1.5; color: #D8DDE1; }
#seasons { position: absolute; z-index: 3; left: max(16px, env(safe-area-inset-left, 0px)); top: calc(env(safe-area-inset-top, 0px) + 70px); display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px; backdrop-filter: blur(6px); }
#seasons[hidden] { display: none; }
#seasons button { font: 600 13px var(--body); color: var(--muted); background: transparent; border: 0; border-radius: 999px; padding: 7px 12px; cursor: pointer; }
#seasons button[aria-pressed="true"] { background: var(--sand); color: #1a0f08; }
#seasons button:focus-visible { outline: 2px solid var(--text); outline-offset: 1px; }
.step .note { margin: 8px 0 0; font-size: 12px; line-height: 1.4; color: var(--sand); }
.step .note[hidden] { display: none; }
.hint { position: absolute; z-index: 3; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 120px); font-size: 13px; color: var(--text); background: var(--panel); padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); }
@media (max-width: 640px) {
  #hud .chip { min-width: 0; padding: 8px 10px; }
  #hud .chip .v { font-size: 18px; }
  #brand { display: none; }
  #seasons { top: calc(env(safe-area-inset-top, 0px) + 78px); }
  #seasons button { padding: 7px 10px; }
  #credits { bottom: calc(env(safe-area-inset-bottom, 0px) + 118px); max-width: 90%; }
}
</style>

<div id="stage">
  <div id="map" role="img" aria-label="__MAP_LABEL__"></div>
  <div id="status">Loading terrain…</div>
  <a id="backBtn" href="../../">← Back to the hike</a>
  <div id="brand">Peak Finder</div>
  <div id="hud" aria-live="polite">
    <div class="chip"><div class="k">Walked</div><div class="v" id="hudDist">0.0 km</div><div class="s">of <span id="hudTotal"></span> km</div></div>
    <div class="chip"><div class="k">Elevation</div><div class="v" id="hudElev">–</div><div class="s" id="hudFt">–</div></div>
  </div>
  <div id="seasons" role="group" aria-label="Season" hidden></div>
  <div class="hint" id="hint">Scroll to walk the trail</div>
  <div id="credits"><span id="seasonNote"></span> Imagery: <a href="https://www.usgs.gov/programs/national-geospatial-program/national-map" target="_blank" rel="noopener">USGS The National Map</a> · Elevation: <a href="https://registry.opendata.aws/terrain-tiles/" target="_blank" rel="noopener">Terrain Tiles</a> (Mapzen, USGS 3DEP) · Trail: <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap contributors</a></div>
  <div id="profile">
    <svg id="profSvg" viewBox="0 0 1000 70" preserveAspectRatio="none" aria-label="Elevation profile of the trail with your position marked" role="img">
      <path id="profArea" fill="rgba(240,138,75,0.22)" stroke="none"></path>
      <path id="profWalk" fill="rgba(240,138,75,0.55)" stroke="none"></path>
      <path id="profLine" fill="none" stroke="#F08A4B" stroke-width="2" vector-effect="non-scaling-stroke"></path>
      <line id="profScout" y1="0" y2="70" stroke="#B4BCC3" stroke-width="1" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"></line>
      <line id="profCursor" y1="0" y2="70" stroke="#F2EFE9" stroke-width="1.5" vector-effect="non-scaling-stroke"></line>
    </svg>
    <div class="lab" style="position:relative"><span>__START_LABEL__ · 0 km</span><span id="scoutLab" style="position:absolute;transform:translateX(-50%)">__KEY_LABEL__</span><span>__END_LABEL__ · <span id="profEnd"></span> km</span></div>
  </div>
</div>

<div id="track">
__STEPS__
</div>

<script>
/* Back control: goes to the in-app hike address passed as ?back=#/hike/<id>?..., else history.back(), else the site root. */
(function () {
  var b = document.getElementById('backBtn'); if (!b) return;
  var p = new URLSearchParams(location.search), back = p.get('back'), name = p.get('backname');
  var root = new URL('../../', location.href);
  var target = null;
  if (back && back.indexOf('#/') === 0) { var u = new URL(back, root); if (u.origin === location.origin) target = u.href; }
  if (name) b.textContent = '\u2190 Back to ' + name.slice(0, 80);
  b.href = target || root.href;
  b.addEventListener('click', function (e) {
    e.preventDefault();
    if (target) location.assign(target);
    else if (history.length > 1) history.back();
    else location.assign(root.href);
  });
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
const PROFILE = __PROFILE__; // [lon, lat, distance m, elevation m] every 10 m, from OSM trail + Terrain Tiles
const TOTAL = PROFILE[PROFILE.length - 1][2];
const base = new URL('.', location.href).href;
const WIDE = __WIDE__;
const CORE = __CORE__;
const MID = __MID__;
const KEY_M = __KEY_M__;   // distance (m) of the marked stop on the profile
const PITCH = __PITCH__, ZOOM = __ZOOM__;
const HEADING = __HEADING__; // null = short lookahead (old behaviour) or [metres behind, metres ahead] = long chord, smoother on switchbacks
const SEASONS = __SEASONS__; // null, or {default, labels, map: {season: {overlay, paint, sky}}, note}
const fmt1 = n => (n / 1000).toFixed(1);
const ft = m => Math.round(m * 3.28084).toLocaleString('en-US');

document.getElementById('hudTotal').textContent = fmt1(TOTAL);
document.getElementById('profEnd').textContent = fmt1(TOTAL);
const elevAt = d => { const i = Math.max(0, Math.min(PROFILE.length - 1, Math.round(d / 10))); return PROFILE[i][3]; };
const gain = Math.abs(PROFILE[PROFILE.length - 1][3] - PROFILE[0][3]); // size of the net change, so descents read as positive
function fillTokens(root) {
  root.querySelectorAll('[data-elev]').forEach(el => {
    const d = Math.min(+el.dataset.elev, TOTAL); const e = elevAt(d);
    el.textContent = Math.round(e).toLocaleString('en-US') + ' m (' + ft(e) + ' ft)';
  });
  root.querySelectorAll('[data-gain]').forEach(el => { el.textContent = Math.round(gain).toLocaleString('en-US') + ' m (' + ft(gain) + ' ft)'; });
}
fillTokens(document);

// Elevation profile
(function drawProfile() {
  const emin = Math.min(...PROFILE.map(p => p[3])) - 20, emax = Math.max(...PROFILE.map(p => p[3])) + 10;
  const X = d => d / TOTAL * 1000, Y = e => 66 - (e - emin) / (emax - emin) * 60;
  const line = PROFILE.map((p, i) => (i ? 'L' : 'M') + X(p[2]).toFixed(1) + ' ' + Y(p[3]).toFixed(1)).join(' ');
  document.getElementById('profLine').setAttribute('d', line);
  document.getElementById('profArea').setAttribute('d', line + ' L1000 70 L0 70 Z');
  window.__prof = { X, Y };
  const sx = X(KEY_M); document.getElementById('profScout').setAttribute('x1', sx); document.getElementById('profScout').setAttribute('x2', sx);
  document.getElementById('scoutLab').style.left = (KEY_M / TOTAL * 100) + '%';
})();
function setProfile(d) {
  const { X, Y } = window.__prof; const x = X(d);
  document.getElementById('profCursor').setAttribute('x1', x); document.getElementById('profCursor').setAttribute('x2', x);
  const pts = PROFILE.filter(p => p[2] <= d);
  if (pts.length > 1) document.getElementById('profWalk').setAttribute('d', pts.map((p, i) => (i ? 'L' : 'M') + X(p[2]).toFixed(1) + ' ' + Y(p[3]).toFixed(1)).join(' ') + ' L' + x.toFixed(1) + ' 70 L0 70 Z');
}

// Geometry helpers
function pointAt(d) {
  d = Math.max(0, Math.min(TOTAL, d));
  const i = Math.min(PROFILE.length - 2, Math.floor(d / 10));
  const a = PROFILE[i], b = PROFILE[i + 1]; const span = (b[2] - a[2]) || 1; const t = Math.max(0, Math.min(1, (d - a[2]) / span));
  return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
}
function bearing(p, q) {
  const r = Math.PI / 180, l1 = p[1] * r, l2 = q[1] * r, dl = (q[0] - p[0]) * r;
  const y = Math.sin(dl) * Math.cos(l2), x = Math.cos(l1) * Math.sin(l2) - Math.sin(l1) * Math.cos(l2) * Math.cos(dl);
  return (Math.atan2(y, x) / r + 360) % 360;
}
function headingAt(d) {
  if (HEADING) {
    // direction of the straight line from a point behind to a point well ahead: ignores individual hairpins
    const end = d > TOTAL - 150;
    const from = end ? TOTAL - 600 : d - HEADING[0], to = end ? TOTAL : d + HEADING[1];
    return (bearing(pointAt(from), pointAt(to)));
  }
  // average direction over the next 60–260 m so the camera turns smoothly on switchbacks
  const p = pointAt(d); let sx = 0, sy = 0;
  for (let k = 60; k <= 260; k += 20) { const b = bearing(p, pointAt(Math.min(TOTAL, d + k))) * Math.PI / 180; sx += Math.sin(b); sy += Math.cos(b); }
  if (d > TOTAL - 70) { const b = bearing(pointAt(TOTAL - 120), pointAt(TOTAL)) * Math.PI / 180; sx = Math.sin(b); sy = Math.cos(b); }
  return (Math.atan2(sx, sy) * 180 / Math.PI + 360) % 360;
}

// Place story cards along the track
const track = document.getElementById('track');
function layoutSteps() {
  const H = track.offsetHeight - innerHeight;
  document.querySelectorAll('.step').forEach(s => { s.style.top = (innerHeight * 0.18 + H * (+s.dataset.at)) + 'px'; });
}
layoutSteps(); addEventListener('resize', layoutSteps);

// Season overlays: one raster source and layer per season that draws something (snow, green or autumn tint); hidden until chosen
const seasonSources = {}, seasonLayers = [];
if (SEASONS) for (const [name, m] of Object.entries(SEASONS.map)) if (m.overlay) {
  seasonSources['season_' + name] = { type: 'raster', tileSize: 512, minzoom: 12, maxzoom: 12, bounds: WIDE, tiles: [base + 'season/' + name + '/{z}/{x}/{y}.png'] };
  seasonLayers.push({ id: 'season_' + name, type: 'raster', source: 'season_' + name, layout: { visibility: 'none' }, paint: { 'raster-fade-duration': 0 } });
}
const map = new maplibregl.Map({
  container: 'map',
  interactive: false,
  attributionControl: false,
  maxPitch: 85,
  pixelRatio: Math.min(window.devicePixelRatio || 1, 1.5),
  center: pointAt(0), zoom: ZOOM, pitch: PITCH, bearing: headingAt(0),
  style: {
    version: 8,
    sky: { 'sky-color': '#3f86d8', 'horizon-color': '#f6d2a8', 'fog-color': '#efc9a0', 'sky-horizon-blend': 0.55, 'horizon-fog-blend': 0.55, 'fog-ground-blend': 0.25, 'atmosphere-blend': 0.5 },
    sources: {
      dem: { type: 'raster-dem', encoding: 'terrarium', tileSize: 256, minzoom: 10, maxzoom: 13, bounds: WIDE, tiles: [base + 'dem/{z}/{x}/{y}.png'] },
      demHs: { type: 'raster-dem', encoding: 'terrarium', tileSize: 256, minzoom: 10, maxzoom: 13, bounds: WIDE, tiles: [base + 'dem/{z}/{x}/{y}.png'] },
      imgLow: { type: 'raster', tileSize: 256, minzoom: 12, maxzoom: 12, bounds: WIDE, tiles: [base + 'img/{z}/{x}/{y}.jpg'] },
      imgMid: { type: 'raster', tileSize: 256, minzoom: 13, maxzoom: 14, bounds: MID, tiles: [base + 'img/{z}/{x}/{y}.jpg'] },
      imgHigh: { type: 'raster', tileSize: 256, minzoom: 15, maxzoom: 16, bounds: CORE, tiles: [base + 'img/{z}/{x}/{y}.jpg'] },
      ahead: { type: 'geojson', data: { type: 'Feature', geometry: { type: 'LineString', coordinates: PROFILE.map(p => [p[0], p[1]]) } } },
      walked: { type: 'geojson', data: { type: 'Feature', geometry: { type: 'LineString', coordinates: [pointAt(0), pointAt(1)] } } },
      hiker: { type: 'geojson', data: { type: 'Feature', geometry: { type: 'Point', coordinates: pointAt(0) } } },
      ...seasonSources
    },
    layers: [
      { id: 'bg', type: 'background', paint: { 'background-color': '#b98a62' } },
      { id: 'imgLow', type: 'raster', source: 'imgLow', paint: { 'raster-fade-duration': 0, 'raster-saturation': 0.38, 'raster-contrast': __CONTRAST__, 'raster-brightness-min': 0.03, 'raster-hue-rotate': -4 } },
      { id: 'imgMid', type: 'raster', source: 'imgMid', paint: { 'raster-fade-duration': 0, 'raster-saturation': 0.38, 'raster-contrast': __CONTRAST__, 'raster-brightness-min': 0.03, 'raster-hue-rotate': -4 } },
      { id: 'imgHigh', type: 'raster', source: 'imgHigh', paint: { 'raster-fade-duration': 0, 'raster-saturation': 0.38, 'raster-contrast': __CONTRAST__, 'raster-brightness-min': 0.03, 'raster-hue-rotate': -4 } },
      ...seasonLayers,
      { id: 'shade', type: 'hillshade', source: 'demHs', paint: { 'hillshade-exaggeration': 0.35, 'hillshade-illumination-direction': 300, 'hillshade-shadow-color': 'rgba(40, 14, 4, 0.55)', 'hillshade-highlight-color': 'rgba(255, 226, 180, 0.35)', 'hillshade-accent-color': 'rgba(60, 20, 6, 0.25)' } },
      { id: 'ahead', type: 'line', source: 'ahead', layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': '#ffffff', 'line-width': 3, 'line-opacity': 0.75, 'line-dasharray': [1.5, 1.5] } },
      { id: 'walked', type: 'line', source: 'walked', layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': '#F08A4B', 'line-width': 5 } },
      { id: 'hikerHalo', type: 'circle', source: 'hiker', paint: { 'circle-radius': 14, 'circle-color': '#F08A4B', 'circle-opacity': 0.35, 'circle-pitch-alignment': 'map' } },
      { id: 'hiker', type: 'circle', source: 'hiker', paint: { 'circle-radius': 7, 'circle-color': '#F08A4B', 'circle-stroke-color': '#ffffff', 'circle-stroke-width': 2.5, 'circle-pitch-alignment': 'map' } }
    ],
    terrain: { source: 'dem', exaggeration: 1 }
  }
});
// Season switch: swaps the overlay, the imagery grading, the sky and each card's photo and wording
function setSeason(name) {
  const m = SEASONS.map[name];
  Object.keys(SEASONS.map).forEach(n => { if (map.getLayer('season_' + n)) map.setLayoutProperty('season_' + n, 'visibility', n === name ? 'visible' : 'none'); });
  for (const id of ['imgLow', 'imgMid', 'imgHigh']) {
    map.setPaintProperty(id, 'raster-saturation', m.paint.saturation);
    map.setPaintProperty(id, 'raster-contrast', m.paint.contrast);
    map.setPaintProperty(id, 'raster-brightness-min', m.paint.brightness_min);
    map.setPaintProperty(id, 'raster-brightness-max', m.paint.brightness_max);
    map.setPaintProperty(id, 'raster-hue-rotate', m.paint.hue);
  }
  const sh = m.shade || { exaggeration: 0.35, shadow: 'rgba(40, 14, 4, 0.55)', highlight: 'rgba(255, 226, 180, 0.35)', accent: 'rgba(60, 20, 6, 0.25)' };
  map.setPaintProperty('shade', 'hillshade-exaggeration', sh.exaggeration);
  map.setPaintProperty('shade', 'hillshade-shadow-color', sh.shadow);
  map.setPaintProperty('shade', 'hillshade-highlight-color', sh.highlight);
  map.setPaintProperty('shade', 'hillshade-accent-color', sh.accent);
  map.setSky({ 'sky-color': m.sky['sky-color'], 'horizon-color': m.sky['horizon-color'], 'fog-color': m.sky['fog-color'], 'sky-horizon-blend': 0.55, 'horizon-fog-blend': 0.55, 'fog-ground-blend': 0.25, 'atmosphere-blend': 0.5 });
  document.querySelectorAll('.step[data-seasons]').forEach(st => {
    const v = JSON.parse(st.dataset.seasons)[name];
    const img = st.querySelector('img'); if (!img.src.endsWith(v.src)) img.src = v.src;
    st.querySelector('h2').innerHTML = v.title;
    st.querySelector('.txt').innerHTML = v.text; fillTokens(st);
    st.querySelector('.credit').innerHTML = v.credit;
    const note = st.querySelector('.note'); note.textContent = v.note; note.hidden = !v.note;
  });
  document.querySelectorAll('#seasons button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.season === name)));
  document.getElementById('seasonNote').textContent = SEASONS.note;
  try { history.replaceState(null, '', '?season=' + name + location.hash); } catch (e) {}
  map.triggerRepaint();
}
function initSeasons() {
  if (!SEASONS) return;
  const box = document.getElementById('seasons'); box.hidden = false;
  for (const name of ['spring', 'summer', 'autumn', 'winter']) {
    const b = document.createElement('button'); b.type = 'button'; b.dataset.season = name; b.textContent = SEASONS.labels[name];
    b.addEventListener('click', () => setSeason(name)); box.appendChild(b);
  }
  const q = new URLSearchParams(location.search).get('season');
  const mo = new Date().getMonth(); // northern hemisphere
  const auto = mo >= 2 && mo <= 4 ? 'spring' : mo >= 5 && mo <= 7 ? 'summer' : mo >= 8 && mo <= 10 ? 'autumn' : 'winter';
  setSeason(SEASONS.map[q] ? q : auto);
}
map.on('error', e => { console.warn('map error', e && e.error && e.error.message); });
map.on('load', () => { document.getElementById('status').hidden = true; initSeasons(); tick(); });
map.once('idle', () => { document.getElementById('status').hidden = true; });
map.on('styledata', () => { if (map.getSource('hiker')) tick(); });

// Scroll drives distance; the camera eases toward it each frame
let target = 0, current = 0, lastIdx = -1, raf = 0;
let bear = headingAt(0);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function progress() {
  const r = track.getBoundingClientRect(); const H = track.offsetHeight - innerHeight;
  return Math.max(0, Math.min(1, -r.top / (H || 1)));
}
function onScroll() { target = progress() * TOTAL; document.getElementById('hint').hidden = target > 40; if (!raf) raf = requestAnimationFrame(tick); }
addEventListener('scroll', onScroll, { passive: true });
function tick() {
  raf = 0;
  if (!map.getSource('hiker')) return;
  current += (target - current) * (reduce ? 1 : 0.12);
  if (Math.abs(target - current) < 0.5) current = target;
  const p = pointAt(current);
  // low-pass the camera heading so it never snaps round (instant under reduced motion)
  const want = headingAt(current), dBear = ((want - bear + 540) % 360) - 180;
  bear = (bear + dBear * (reduce ? 1 : 0.08) + 360) % 360;
  map.jumpTo({ center: p, bearing: bear, pitch: PITCH, zoom: ZOOM });
  document.getElementById('status').hidden = true;
  map.getSource('hiker').setData({ type: 'Feature', geometry: { type: 'Point', coordinates: p } });
  const idx = Math.floor(current / 10);
  if (idx !== lastIdx) {
    lastIdx = idx;
    const coords = PROFILE.filter(q => q[2] <= current).map(q => [q[0], q[1]]); coords.push(p);
    if (coords.length < 2) coords.unshift(pointAt(0));
    map.getSource('walked').setData({ type: 'Feature', geometry: { type: 'LineString', coordinates: coords } });
  }
  const e = elevAt(current);
  document.getElementById('hudDist').textContent = fmt1(current) + ' km';
  document.getElementById('hudElev').textContent = Math.round(e).toLocaleString('en-US') + ' m';
  document.getElementById('hudFt').textContent = ft(e) + ' ft';
  setProfile(current);
  if (current !== target || Math.abs(dBear) > 0.3) raf = requestAnimationFrame(tick);
}
</script>
