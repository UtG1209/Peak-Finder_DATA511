name: CI

on:
  pull_request:
  push:
    branches-ignore: [main] # main is built and tested by the deploy workflow

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: CLAUDE.md matches the code (every agent reads it first)
        working-directory: .
        run: node scripts/check-claude-md.mjs
      - run: npm ci
      - run: npm run lint
      - run: npm test # models, URL state, and the data contract on app/public/data
      - run: npm run build
        env:
          SKIP_WALKS: '1' # branch builds leave out the ~110 MB of 3D walks; the deploy build includes them
      - name: Performance budget (initial JS, map chunk, data size, no walks on first load)
        working-directory: .
        run: node scripts/check-budget.mjs
      # Every branch gets a downloadable build, so a teammate can look at the UI before it is merged.
      - uses: actions/upload-artifact@v4
        with:
          name: app-build-${{ github.sha }}
          path: app/dist
          retention-days: 14

  pipeline:
    # Placeholder for lanes 1 and 2: runs pipeline/checks once they exist (CLAUDE.md section 6).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fake data is reproducible (generator output equals what is committed)
        run: |
          python scripts/make_fake_data.py
          git diff --exit-code app/public || { echo "Fake data is out of date: run  npm run fake-data  and commit the result"; exit 1; }
      - name: Pipeline checks
        run: |
          if [ -d pipeline/checks ] && ls pipeline/checks/*.py >/dev/null 2>&1; then
            python -m pip install -r pipeline/requirements.txt
            python -m pytest pipeline/checks -q
          else
            echo "No pipeline/checks yet (lanes 1 and 2 add them)."
          fi

  walks:
    # The 3D walk tooling: unit tests and a read-only verification of every walk in walks/manifest.json (no network, standard library only).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s pipeline/walks -v
      - run: python pipeline/walks/build_walk.py --verify-all

  e2e:
    # Real browser smoke test of the production build under the GitHub Pages base path: Show hikes must reveal a map with size,
    # a hike must open with its cost graph, Back must return to a visible map. (The map once collapsed to height 0 on the live site.)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            app/playwright-report
            app/test-results
          retention-days: 7

