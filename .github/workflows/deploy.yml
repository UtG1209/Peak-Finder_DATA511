name: Deploy to GitHub Pages

# Every push to main tests, builds and publishes the app. The live link is the shared UI for the team:
#   https://utg1209.github.io/Peak-Finder_DATA511/
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install, lint, test
        working-directory: app
        run: |
          npm ci
          npm run lint
          npm test
      - name: Build (the Vite config copies walks/ into dist/walks/, so the 3D walks ship with the site)
        working-directory: app
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build
      - name: Performance budget
        run: node scripts/check-budget.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
