<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Set the theme before the stylesheet paints (no flash). Same rule as resolveTheme() in src/lib/theme.ts: stored choice, else the system setting. -->
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem('peak-finder-theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
    <title>Peak Finder</title>
    <!-- terracotta mountain: same accent in both themes, readable on light and dark tab strips -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="description" content="Where, when and how much: find a national park hike that fits your limits." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
